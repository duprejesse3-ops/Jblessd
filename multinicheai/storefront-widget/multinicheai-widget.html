<!--
  multiNicheAI storefront chat widget.
  Drop this snippet before </body> on multinicheai.com (Netlify site).
  Talks to the same backend as the app — a customer's credit balance
  is shared across the widget, phone app, and Windows app once they log in.
-->
<div id="mnai-widget-root"></div>

<style>
  #mnai-launcher {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1a1a18;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 9999;
    border: none;
  }
  #mnai-panel {
    position: fixed;
    bottom: 88px;
    right: 20px;
    width: 340px;
    max-height: 480px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e4e2d9;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: -apple-system, sans-serif;
  }
  #mnai-panel.open { display: flex; }
  #mnai-header {
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #mnai-header span:first-child { font-weight: 600; font-size: 14px; }
  #mnai-balance { font-size: 12px; color: #185fa5; }
  #mnai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
  }
  .mnai-bubble { border-radius: 10px; padding: 8px 12px; font-size: 13px; max-width: 85%; }
  .mnai-user { background: #1a1a18; color: #fff; align-self: flex-end; }
  .mnai-ai { background: #f0efe9; color: #1a1a18; align-self: flex-start; }
  #mnai-input-row {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid #eee;
  }
  #mnai-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
  }
  #mnai-send {
    background: #1a1a18;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #mnai-error { color: #c0392b; font-size: 11px; padding: 0 12px 6px; }
</style>

<button id="mnai-launcher" aria-label="Open multiNicheAI chat">&#128172;</button>
<div id="mnai-panel">
  <div id="mnai-header">
    <span>multiNicheAI</span>
    <span id="mnai-balance"></span>
  </div>
  <div id="mnai-messages"></div>
  <div id="mnai-error"></div>
  <div id="mnai-input-row">
    <input id="mnai-input" type="text" placeholder="Ask about our products..." />
    <button id="mnai-send">Send</button>
  </div>
</div>

<script>
(function () {
  const API_BASE_URL = "https://api.multinicheai.com";
  let token = localStorage.getItem("mnai_token");
  let history = [];

  const launcher = document.getElementById("mnai-launcher");
  const panel = document.getElementById("mnai-panel");
  const messagesEl = document.getElementById("mnai-messages");
  const inputEl = document.getElementById("mnai-input");
  const sendBtn = document.getElementById("mnai-send");
  const balanceEl = document.getElementById("mnai-balance");
  const errorEl = document.getElementById("mnai-error");

  launcher.addEventListener("click", () => panel.classList.toggle("open"));

  async function ensureSession() {
    if (token) return;
    // Anonymous guest session: creates a lightweight account so visitors can
    // try the widget without a signup wall. Swap for real signup/login UI
    // if you want purchases tied to a named account from the first message.
    const guestEmail = `guest-${Date.now()}@widget.multinicheai.com`;
    const guestPassword = Math.random().toString(36).slice(2) + "Aa1!";
    const res = await fetch(`${API_BASE_URL}/auth/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: guestEmail, password: guestPassword }),
    });
    const data = await res.json();
    token = data.access_token;
    localStorage.setItem("mnai_token", token);
    updateBalance(data.credit_balance);
  }

  function updateBalance(balance) {
    balanceEl.textContent = `${balance.toFixed(1)} credits`;
  }

  function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = `mnai-bubble mnai-${role === "user" ? "user" : "ai"}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message) return;
    errorEl.textContent = "";
    await ensureSession();

    addBubble("user", message);
    inputEl.value = "";

    try {
      const res = await fetch(`${API_BASE_URL}/chat/send`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ message, conversation_history: history }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.detail || "Something went wrong.";
        return;
      }
      history.push({ role: "user", content: message });
      history.push({ role: "assistant", content: data.reply });
      addBubble("assistant", data.reply);
      updateBalance(data.remaining_balance);
    } catch (e) {
      errorEl.textContent = "Couldn't reach multiNicheAI. Try again.";
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
})();
</script>
