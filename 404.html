<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — MULTINICHE AI</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="This page does not exist. Head back to the MULTINICHE AI storefront." />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap"
    />
    <style>
      :root {
        --ink: #0A0E16;
        --paper: #EEF2F8;
        --brass: #FFB020;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: clamp(4rem, 18vw, 8rem);
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--brass);
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        margin: 0 0 2rem;
        opacity: 0.75;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border: 2px solid var(--ink);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
      }
      a.primary {
        background: var(--ink);
        color: var(--paper);
      }
      a:hover {
        background: var(--brass);
        border-color: var(--brass);
        color: var(--paper);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page does not exist</h1>
      <p>The link may be out of date, or the address may have a typo in it. Everything we publish is one hop away.</p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a href="/#catalog">Browse the catalog</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
