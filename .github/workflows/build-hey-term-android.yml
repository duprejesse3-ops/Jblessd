#
# Builds the Hey Term Android app (packages/hey-term-android). Runs here,
# not in Claude's own sandbox, because that sandbox's network is locked
# down to npm/pip/GitHub and can't reach Google's Android SDK/NDK/Maven
# servers or Gradle's distribution server -- GitHub Actions runners have
# ordinary internet access, so this is where the actual compile happens.
#
# Trigger manually from the Actions tab (workflow_dispatch) or push to main
# with changes under packages/hey-term-android/. The result is a debug-
# signed APK attached as a downloadable build artifact on the run -- good
# enough to sideload onto your own phone; a real release build (signed with
# your own keystore, for wider distribution) is a separate step later.
name: Build Hey Term Android APK

on:
  push:
    branches: [main]
    paths:
      - "packages/hey-term-android/**"
      - ".github/workflows/build-hey-term-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hey-term-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already have an Android SDK preinstalled at
      # /usr/local/lib/android/sdk -- reusing it directly instead of the
      # android-actions/setup-android@v3 action, which was failing here:
      # its own internal license-acceptance step hit a license (Google TV
      # add-on) that isn't in its baked-in accepted list and tried an
      # interactive "Review licenses (y/N)?" prompt with no stdin to answer
      # it, which fails outright in CI. `yes | sdkmanager --licenses` below
      # accepts everything non-interactively instead.
      - name: Set up Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install NDK + CMake
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download the ggml speech model
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 -o app/src/main/assets/models/ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la app/src/main/assets/models/

      # The actual keystore is checked in base64-encoded (as
      # hey-term-debug.keystore.b64), decoded here at build time -- GitHub's
      # web upload UI (Add file -> Upload files) fails to process the raw
      # binary .keystore file ("Something went really wrong"), but handles
      # a plain text file fine. Decoding it the same way every build is what
      # actually matters: every APK gets signed with this same key, so
      # installing a new build over an old one behaves like a normal app
      # update instead of failing with "App not installed" (see
      # app/build.gradle.kts' signingConfigs.debug for why that was
      # happening before this file existed).
      - name: Decode debug keystore
        run: base64 -d hey-term-debug.keystore.b64 > hey-term-debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hey-term-debug-apk
          path: packages/hey-term-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
