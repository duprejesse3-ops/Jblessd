[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Refuse the site's own source. publish = "." above means the repository root is
# the published directory, so every one of these paths is a real file sitting in
# it: Netlify strips the functions tree on its way to the CDN but nothing else,
# and a plain GET for /netlify/lib/admin-auth.mts returned the TypeScript source
# of the owner session logic. Also exposed: the edge functions, the database
# migrations, container/.env.example, and packages/, which holds a product sold
# under a single-purchaser licence.
#
# force = true is what makes these work and is not optional. Without it a
# redirect rule loses to a file that actually exists on disk, which is precisely
# the case here — the CDN would go on serving the source and the rule would
# never fire.
#
# status = 404 with a `to` serves that file's bytes under a 404, so a person
# gets the site's 404 page and a crawler gets the status that keeps the path out
# of the index.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/container/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/packages/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deno.lock"
  to = "/404.html"
  status = 404
  force = true

# Google tag gateway for advertisers ("first-party mode"): /metrics is reserved as
# the tag serving path and proxied to Google's gateway endpoint by
# netlify/edge-functions/tag-gateway.ts, so tag libraries and measurement hits are
# fetched from this domain instead of www.googletagmanager.com.
#
# Declared FIRST, ahead of csp below, because netlify.toml declarations run in
# order and the gateway function returns a response without calling
# context.next(). That ends the chain, so a measurement request never reaches the
# HTML-rewriting middleware or the redirect engine — it only ever costs one hop.
#
# Both paths are needed: the loader snippets request "/metrics/?id=…" while the
# collect endpoints are "/metrics/g/collect", and "/metrics" with no trailing
# slash must not fall through to the SPA. See the edge function for why this is
# not a [[redirects]] proxy (per-request Host and geolocation headers).
[[edge_functions]]
  path = "/metrics"
  function = "tag-gateway"

[[edge_functions]]
  path = "/metrics/*"
  function = "tag-gateway"

# The Content-Security-Policy is generated per request by netlify/edge-functions/csp.ts,
# not by a [[headers]] rule, because it carries a one-time nonce that the same
# function stamps onto every <script> element on the way out. Declared here rather
# than inline so it is guaranteed to run before the inline-declared seo and pages
# functions: netlify.toml declarations run first, so context.next() hands csp.ts the
# finished document and no script tag escapes without a nonce.
#
# excludedPath keeps the function off everything that is not an HTML document.
# csp.ts only rewrites a response when it is a GET returning text/html — for a
# JSON API reply, a script file, an icon or the sitemap it invoked context.next()
# and handed the response straight back, doing nothing but costing an edge
# invocation. Since the storefront makes several API and asset requests per page
# view, that was a large multiple on our busiest paths for no benefit. The
# baseline security headers in the [[headers]] block below are applied by the CDN
# and still cover every excluded path, so nothing is left unprotected.
#
# /p/* is excluded for a different reason than the asset paths: those are skipped
# because the function would do nothing useful, while workspace apps are skipped
# because it would do the wrong thing. Pages under /p/ are code the owner wrote in
# the browser workspace at /code, and netlify/functions/code-serve.mts serves them
# under their own, much stricter CSP — a `sandbox` policy with no
# `allow-same-origin`, which drops them into an opaque origin where they cannot
# reach this origin's cookies or storage. Two Content-Security-Policy headers are
# enforced as their intersection, so letting csp.ts add the storefront policy on
# top would block the CDN libraries those apps legitimately load while adding
# nothing the sandbox has not already covered.
[[edge_functions]]
  path = "/*"
  excludedPath = [
    "/api/*",
    "/.netlify/*",
    "/.well-known/*",
    "/icons/*",
    "/p/*",
    "/*.js",
    "/*.json",
    "/*.xml",
    "/*.txt",
    "/*.png",
    "/*.ico",
    "/*.webmanifest",
  ]
  function = "csp"

# Order confirmation page. Stripe sends buyers here after a successful payment
# (see success_url in netlify/functions/create-checkout-session.mts), and this is
# the URL to hand to Google Ads / Google Tag Manager as the order confirmation
# page.
#
# It is a rewrite (status 200), not a redirect: the storefront's own HTML —
# including the Google Tag Manager container snippet and its <noscript> iframe —
# is served verbatim at this URL, so a tag detector that fetches
# /order-confirmation finds GTM-M746RK4R in the first response without running
# any JavaScript and without following a hop. The purchase flow previously ended
# on "/?checkout=success&session_id=…", and Google Ads' guided purchase-conversion
# setup has no stable page to inspect there — it normalizes the query string away
# and reports "Tag Manager container not found" for the confirmation page even
# though the homepage itself is tagged. A path of its own fixes that while the
# buyer keeps the exact same delivery experience, because the same single-page
# app answers both URLs.
#
# Deliberately NOT noindex'd: index.html carries <link rel="canonical"
# href="https://jblessd.com/">, so search engines consolidate this URL into the
# homepage on their own, and nothing (an X-Robots-Tag, a robots.txt Disallow) is
# left in the way of Google's tag detector fetching the page.
[[redirects]]
  from = "/order-confirmation"
  to = "/index.html"
  status = 200

# Claude Agent Studio — the customer-facing agent rented by the credit. Served at
# the clean /agent URL that Stripe's success_url and the access-key emails point
# at (see netlify/functions/credits.mts), as a rewrite so the buyer returning from
# Checkout lands on the real page with ?credits=success&session_id=… intact and
# the page can claim the top-up itself.
#
# Unlike /admin this is a revenue page and stays fully indexable.
[[redirects]]
  from = "/agent"
  to = "/agent.html"
  status = 200

# Private owner-only AI workstation. Served at the clean /admin URL; the page
# itself is a static login gate that reveals nothing until the ADMIN_PASSWORD
# session is established, so a public rewrite is safe.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Browser code workspace. This is where the site hosts its own development
# environment: source is written here on any device, stored in Netlify Database,
# and served straight back at /p/<slug> by netlify/functions/code-serve.mts with
# no build and no deploy in between.
#
# Like /admin it is a static login gate behind the same ADMIN_PASSWORD session,
# so the rewrite is public while the workspace behind it is not.
[[redirects]]
  from = "/code"
  to = "/code.html"
  status = 200

# Baseline security headers applied to every response. Scoped to /* so both the
# static storefront and the edge-rendered pages inherit them.
#
# Content-Security-Policy is deliberately absent from this block — it is emitted by
# netlify/edge-functions/csp.ts, which mints a per-request nonce and stamps it onto
# every <script> element. Custom headers are applied on top of edge function
# responses, so a CSP declared here would arrive alongside the nonced one and the
# browser would enforce both policies at once; the stricter intersection would then
# block scripts the nonce was meant to allow. Keep the policy in exactly one place.
# The rationale for every allowlisted host lives in that file.
#
# Framing/isolation notes — these are deliberately tuned so tag debugging works:
#   - frame-ancestors (in the CSP from csp.ts) allows only ourselves and the Google
#     Tag Assistant / Tag Manager preview origins that have to embed the page to
#     debug it, so clickjacking from arbitrary origins is still blocked.
#     X-Frame-Options is intentionally NOT set: it has no allowlist (only
#     DENY/SAMEORIGIN), so any value strict enough to be useful also blocks Tag
#     Assistant, and browsers enforce it on top of CSP. frame-ancestors is its
#     modern, more expressive replacement.
#   - Cross-Origin-Opener-Policy is intentionally NOT set (i.e. left at the
#     unsafe-none default). Tag Assistant opens the site in a new tab and debugs
#     it over the window.opener channel; COOP: same-origin severs that opener
#     link for a cross-origin opener, which also surfaces as "tag not found".
#     The site needs no cross-origin isolation (no SharedArrayBuffer), so the
#     only cost is losing COOP's XS-leak hardening.
# HSTS forces HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Declare the site language at the HTTP layer. Bing's SEO analyzer flags a
    # "Meta Language tag" warning when a page has only <html lang> and no explicit
    # content-language signal; the header (paired with the meta tag in the HTML)
    # satisfies that check for every response, including the edge-rendered pages.
    Content-Language = "en-US"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Service worker must always revalidate so app updates ship immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The storefront is immutable within a deploy. A short browser cache plus stale
# revalidation removes repeat-request latency without hiding new deploys.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Apps written in the browser workspace, served by
# netlify/functions/code-serve.mts. Never cached, at any layer.
#
# Declared after the /*.js rule above and deliberately so. Netlify's `*` matches
# across path segments, so "/*.js" also matches "/p/my-app/app.js" — without this
# block an app's script and stylesheet would be handed an hour-long browser cache
# while its index.html revalidated, which shows up as a save that took effect for
# the markup and silently did not for the code. The whole promise of the workspace
# is that a save is live on the next load, so nothing under /p/ is cacheable.
#
# The function sets the same value on its own responses; this rule is what makes
# it hold regardless of how the CDN merges the two, and it covers a draft app
# (owner-only) as well as a published one.
[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Agent studio: always revalidate. Credit pack pricing and tier costs are fetched
# from /api/credits at runtime, but the page also renders a balance and an access
# key for a signed-in customer, so a cached copy must never be reused blindly.
[[headers]]
  for = "/agent"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/agent.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Private admin workstation — keep it out of every search index and cache.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# The code workspace — private to the owner, and never cached: it renders the
# source of whatever is being worked on right now, and a stale copy would show
# yesterday's code as though it were live.
[[headers]]
  for = "/code"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/code.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# App icons can be cached aggressively.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Root favicon served to browsers and Google's favicon crawler.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=604800"

# Digital Asset Links — proves this domain owns the Google Play TWA so the
# Android app runs full-screen with no browser address bar. Must be JSON.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Bing Webmaster Tools site verification file — served from the root so Bing
# can confirm domain ownership. Must be XML and always revalidated.
[[headers]]
  for = "/BingSiteAuth.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=0, must-revalidate"
