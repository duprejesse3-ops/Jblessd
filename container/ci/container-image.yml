# Publishes the jblessd.com storefront image to GitHub Container Registry.
#
# NOT ACTIVE WHERE IT SITS. GitHub refuses pushes that touch
# .github/workflows/ unless the pushing app holds the `workflows` permission,
# which Netlify's GitHub App does not, so this file is parked here instead.
# Activate it with one move, committed by you rather than by the app:
#
#   git mv container/ci/container-image.yml .github/workflows/
#   git commit -m "Add container image workflow" && git push
#
# Tagging a release (v1.4.0) publishes 1.4.0, 1.4, 1 and latest. Pushes to the
# default branch publish `edge` only, so `latest` never moves without a release.
# The manual run builds without publishing, which is the cheap way to check that
# a Dockerfile change still builds on both architectures.
#
# Every run also exports the image as a loadable .tar.gz per architecture, for
# targets that cannot pull from a registry. Those are uploaded as workflow
# artifacts, and attached to the GitHub release when the trigger is a v* tag.
# container/save.sh does the same thing on a laptop.

name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The seams this container reimplements — TOML parsing, routing, cron, blob
  # containment — are what break silently, so they gate the publish. No database
  # is needed; the suite covers the adapters, not the application's own logic.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix container install --no-audit --no-fund
      - run: node --import ./container/hooks/register.mjs container/test/smoke.mjs

  image:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU is what makes the arm64 half of the manifest possible on an amd64
      # runner. It is slow, which is why the build cache below matters.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jblessd-store
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=jblessd.com storefront
            org.opencontainers.image.url=https://jblessd.com

      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          # These --label flags override the Dockerfile's own LABEL defaults, so
          # revision and created are accurate without passing them as build args.
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Offline artifacts: one loadable image tar per architecture, for a target that
  # cannot reach GHCR. Split from the publish job because the exporters are
  # mutually exclusive — a build can push a multi-arch manifest or write a
  # single-platform archive, not both — and because a matrix builds the two
  # architectures in parallel rather than serially behind QEMU. The layers
  # themselves are not rebuilt: cache-from picks up what the job above cached.
  tarball:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to attach the archives to a v* release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The reference baked into the archive has to be the one a registry pull
      # would have produced, so a stack that sets APP_IMAGE to the GHCR tag works
      # unchanged after `docker load`. GHCR rejects an uppercase path, and
      # repository_owner is spelled however the account is.
      - id: ref
        run: |
          mkdir -p dist   # buildx will not create the dest directory itself
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          case "${{ github.ref }}" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            refs/heads/main) version=edge ;;
            *) version="sha-$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/jblessd-store:$version" >> "$GITHUB_OUTPUT"
          echo "file=jblessd-store-$version-linux-${{ matrix.arch }}.tar" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            IMAGE_VERSION=${{ steps.ref.outputs.version }}
          # type=docker is a docker-archive on disk: `docker load` and
          # `podman load` both read it, and nothing is pushed anywhere.
          outputs: type=docker,dest=dist/${{ steps.ref.outputs.file }}
          cache-from: type=gha

      # Layers are stored uncompressed in a docker-archive, so this roughly
      # halves the upload and the download. Both runtimes load the .gz directly.
      - run: |
          gzip -f "dist/${{ steps.ref.outputs.file }}"
          cd dist && sha256sum "${{ steps.ref.outputs.file }}.gz" \
            > "${{ steps.ref.outputs.file }}.gz.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: image-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 30
          compression-level: 0 # already gzipped

      # Release assets outlive artifacts, which expire, so a tag also gets a
      # permanent copy. `create` is tolerated failing: on a tag pushed after the
      # release was made by hand, the release already exists.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag || true
          gh release upload "$tag" dist/* --clobber
